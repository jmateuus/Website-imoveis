name: website-imoveis
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-imoveis}
      POSTGRES_USER: ${POSTGRES_USER:-imoveis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    entrypoint: /opt/bitnami/minio/bin/minio
    command: server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Defina S3_ACCESS_KEY no .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Defina S3_SECRET_KEY no .env}
    volumes:
      - minio-data:/bitnami/minio/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: [CMD, /usr/bin/curl, -fsS, --max-time, '3', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 4s
      retries: 20
  api:
    build: ./backend
    environment: &api-environment
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-imoveis}
      DATABASE_USERNAME: ${POSTGRES_USER:-imoveis}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: imoveis
      S3_REGION: us-east-1
      S3_CREATE_BUCKET: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Defina ADMIN_EMAIL no .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_DATA: ${DEMO_DATA:-false}
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1},minio,postgres"
      no_proxy: "${NO_PROXY:-localhost,127.0.0.1},minio,postgres"
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, -T, "3", -O, /dev/null, "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"
volumes:
  postgres-data:
  minio-data:
