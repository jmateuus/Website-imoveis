server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 110m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 180s;
    proxy_request_buffering off;
  }
  location = /actuator/health { proxy_pass http://api:8080; }
  location ~ ^/(swagger-ui(?:/|\.html)|v3/api-docs) {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }
  location / { try_files $uri $uri/ /index.html; }
}
