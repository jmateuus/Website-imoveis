name: Verificar catálogo
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preparar ferramentas e dependências
        run: bash scripts/cloud-setup.sh
      - name: Iniciar serviços
        run: python3 scripts/cloud-dev.py start
      - name: Compilar e testar API e frontend
        run: python3 scripts/cloud-dev.py test
      - name: Validar desktop e celular
        working-directory: frontend
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run test:e2e
      - name: Encerrar processos
        if: always()
        run: python3 scripts/cloud-dev.py stop
