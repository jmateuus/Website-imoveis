spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/imoveis}
    username: ${DATABASE_USERNAME:imoveis}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  jackson:
    default-property-inclusion: non_null
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  demo-data: ${DEMO_DATA:false}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:imoveis}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    create-bucket: ${S3_CREATE_BUCKET:false}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
